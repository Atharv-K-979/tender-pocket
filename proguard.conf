# ==============================================================================
# ProGuard Obfuscation Rules for TenderPocket Spring Boot Application
# Scrambles class, method, and variable names to block decompilation and AI analysis
# ==============================================================================

# Don't warn about 3rd-party library dependencies
-dontwarn **
-ignorewarnings

# Keep main Spring Boot application bootstrapper entry point
-keep public class com.tenderpocket.TenderPocketApplication {
    public static void main(java.lang.String[]);
}

# Preserve Spring & Jackson annotations required for dependency injection & JSON REST APIs
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions

# Preserve Spring Bean entry points and JPA entities
-keep @org.springframework.stereotype.Controller class * { *; }
-keep @org.springframework.web.bind.annotation.RestController class * { *; }
-keep @org.springframework.stereotype.Service class * { *; }
-keep @org.springframework.stereotype.Component class * { *; }
-keep @org.springframework.stereotype.Repository class * { *; }
-keep @jakarta.persistence.Entity class * { *; }
-keep @jakarta.persistence.Table class * { *; }

# Obfuscate & Scramble internal methods and local variables in business logic
-keepclassmembers class * {
    @org.springframework.beans.factory.annotation.Autowired *;
    @org.springframework.beans.factory.annotation.Value *;
    @org.springframework.context.annotation.Bean *;
    @jakarta.persistence.* *;
}
