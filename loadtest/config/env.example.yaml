# Copy to loadtest/config/env.yaml (gitignored) and fill in. NEVER commit env.yaml.
# Hosts, credentials and SSH aliases live ONLY here (G2, G4).

target:
  # Next.js frontend URL on EC2-2 — the path real users take (G3). All k6 traffic goes here.
  frontend_url: "http://EC2-2-HOST-OR-IP:8085"
  # Optional: hostname/IP list that pre-flight must resolve the frontend host to (extra pin).
  expected_ips: []

# EC2-1 deny-list (G2). Every tool resolves the target host and aborts if ANY resolved
# address or hostname matches one of these entries. List every hostname, public IP,
# private IP and Elastic IP of EC2-1.
ec2_1_denylist:
  - "EC2-1-PUBLIC-IP"
  - "EC2-1-PRIVATE-IP"
  - "ec2-1-hostname.example"

# Remote execution on EC2-2 (orchestrator, seeder, monitors). An SSH alias from ~/.ssh/config.
remote:
  ssh_alias: "tp-ec2-2"
  # Working dir on EC2-2 for dumps, agent and logs (created on first use).
  workdir: "/var/tmp/tp-loadtest"

containers:
  backend: "tender-pocket-backend"
  frontend: "tender-pocket-frontend"
  postgres: "tender-pocket-postgres"

postgres:
  # Used only inside `docker exec <postgres> psql -U <user> -d <db>` (socket auth in container).
  user: "PG_USER"
  db: "PG_DB"

# Password given to every seeded load-test user (lt_*). Hashed by the seeder exactly as
# SecurityConfig.passwordEncoder does (unsalted SHA-256 hex, SecurityConfig.java:29-56).
test_user_password: "CHANGE-ME-long-random-string"

generator:
  # Free-text label recorded in manifest.json (e.g. "c6i.xlarge ap-south-1 generator").
  host_label: "loadgen-1"
  instance_type: "UNKNOWN"

target_host:
  instance_type: "UNKNOWN"   # EC2-2 instance type, recorded in manifest.json

mock_ai:
  # URL of the mock AI as seen FROM EC2-2's backend container (AZURE_OPENAI_ENDPOINT value).
  endpoint_for_backend: "http://LOADGEN-PRIVATE-IP:8800/v1"
  # URL the orchestrator uses to check reachability from the generator.
  health_url: "http://127.0.0.1:8800/health"
