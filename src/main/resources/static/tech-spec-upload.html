<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TenderPocket — Executive Technical Specification Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background-color: rgba(37, 99, 235, 0.2);
      color: #60a5fa;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }
    .tender-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      border-color: var(--primary);
    }
    .tender-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
      color: #ffffff;
    }
    .tender-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .status-missing {
      background-color: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .status-ready {
      background-color: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      margin-bottom: 12px;
      background-color: rgba(15, 23, 42, 0.5);
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .upload-zone:hover {
      border-color: var(--primary);
    }
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .btn:disabled {
      background-color: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    .docs-list {
      font-size: 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .docs-list a {
      color: #60a5fa;
      text-decoration: none;
      display: block;
      margin-top: 4px;
    }
    .docs-list a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Executive Technical Specification Portal <span class="badge">Tender Executive Mode</span></h1>
        <p style="color: var(--text-muted); margin: 4px 0 0 0; font-size: 13px;">Requirement: Tender Executives must upload the Technical Specification PDF before Bid Documents generation can occur.</p>
      </div>
      <div>
        <a href="/" style="color: #60a5fa; text-decoration: none; font-weight: 500; font-size: 14px;">← Back to Main Dashboard</a>
      </div>
    </header>

    <div class="tender-grid" id="tenderGrid">
      <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
        Loading tenders...
      </div>
    </div>
  </div>

  <script>
    async function loadTenders() {
      try {
        const res = await fetch('/api/tenders');
        const data = await res.json();
        const tenders = data.tenders || [];
        const grid = document.getElementById('tenderGrid');
        
        if (tenders.length === 0) {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No active tenders found.</div>';
          return;
        }

        grid.innerHTML = tenders.slice(0, 30).map(t => {
          const docsStr = t.downloaded_docs || t.downloadedDocs || '[]';
          let isUploaded = false;
          try {
            const docs = JSON.parse(docsStr);
            isUploaded = docs.some(d => (d.name && d.name.toLowerCase().includes('technical specification')) || (d.filename && d.filename.toLowerCase().includes('technical_specification')));
          } catch(e) {}

          return `
            <div class="card">
              <div>
                <div class="tender-title">${t.title || 'Untitled Tender'}</div>
                <div class="tender-meta">Ref: ${t.refNo || t.id} | Due: ${t.dueDate || 'N/A'}</div>
                
                <div class="status-indicator ${isUploaded ? 'status-ready' : 'status-missing'}">
                  ${isUploaded ? '✓ Technical Spec PDF Uploaded' : '⚠️ Technical Spec PDF Required First'}
                </div>

                <div class="upload-zone" onclick="document.getElementById('file-${t.id}').click()">
                  <input type="file" id="file-${t.id}" accept=".pdf" style="display:none" onchange="uploadFile('${t.id}', this)">
                  <span style="font-size:13px; color: #cbd5e1;">📤 Click to Upload Technical Specification PDF</span>
                </div>
              </div>

              <div>
                <button class="btn" ${isUploaded ? '' : 'disabled'} onclick="generateBidDocs('${t.id}')">
                  ${isUploaded ? '⚡ Generate Bid Documents' : '🔒 Upload PDF First to Enable Generation'}
                </button>

                <div class="docs-list" id="docs-${t.id}">
                  ${getDocsHtml(docsStr)}
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    }

    function getDocsHtml(docsStr) {
      try {
        const docs = JSON.parse(docsStr);
        if (!docs.length) return '';
        return '<strong>Available Documents:</strong>' + docs.map(d => `<a href="${d.local_path}" target="_blank">📄 ${d.name || d.filename}</a>`).join('');
      } catch(e) { return ''; }
    }

    async function uploadFile(tenderId, input) {
      if (!input.files || !input.files[0]) return;
      const formData = new FormData();
      formData.append('file', input.files[0]);

      try {
        const res = await fetch(`/api/tenders/${tenderId}/upload-tech-spec`, {
          method: 'POST',
          headers: {
            'x-user-role': 'Tender Executive',
            'x-user-username': 'executive'
          },
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          alert('✅ Technical Specification PDF uploaded successfully!');
          loadTenders();
        } else {
          alert('❌ Upload failed: ' + (data.error || 'Unknown error'));
        }
      } catch (e) {
        alert('❌ Error uploading file: ' + e.message);
      }
    }

    async function generateBidDocs(tenderId) {
      try {
        const res = await fetch(`/api/tenders/${tenderId}/generate-bid-docs`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-role': 'Tender Executive',
            'x-user-username': 'executive'
          },
          body: JSON.stringify({
            date: new Date().toLocaleDateString('en-GB'),
            companyName: 'Mark Enterprises',
            companyAddress: 'MIDC Satpur, Nashik - 422007',
            signatoryName: 'Korra Praveen Naik',
            signatoryDesignation: 'Partner'
          })
        });
        const data = await res.json();
        if (data.success) {
          alert('✅ Bid Documents generated successfully!');
          loadTenders();
        } else {
          alert('⚠️ Cannot generate: ' + (data.error || 'Upload Technical Specification PDF first.'));
        }
      } catch (e) {
        alert('❌ Error generating bid documents: ' + e.message);
      }
    }

    loadTenders();
  </script>
</body>
</html>
